[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "production-mlops-platform"
version = "0.1.0"
description = "Reproducible MLOps for predictive maintenance"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "mlflow>=3.17,<4", "pandera[pandas]>=0.22,<1", "evidently>=0.7,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "prometheus-client>=0.21,<1", "psycopg[binary]>=3.2,<4", "pytest>=8,<10", "httpx>=0.28,<1"]

[project.optional-dependencies]
orchestration = ["prefect>=3.0,<4"]
versioning = ["dvc>=3.0,<4"]

[project.scripts]
mlops_platform = "mlops_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
