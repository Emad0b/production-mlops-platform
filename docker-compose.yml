services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mlops_platform
      POSTGRES_USER: mlops_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops_platform"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["127.0.0.1:8200:8200"]
    environment:
      DATABASE_URL: postgresql://mlops_platform:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/mlops_platform
      MLFLOW_TRACKING_URI: sqlite:////runtime/mlflow.db
      MLOPS_ADMIN_TOKEN: ${MLOPS_ADMIN_TOKEN:-}
    volumes: ["runtime:/runtime"]
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
  mlflow:
    build: .
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////runtime/mlflow.db", "--default-artifact-root", "/runtime/artifacts", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--allowed-hosts", "localhost:5001,127.0.0.1:5001,localhost:5000,127.0.0.1:5000,mlflow:5000"]
    ports: ["127.0.0.1:5001:5000"]
    volumes: ["runtime:/runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=5)"]
      interval: 5s
      retries: 20
  dashboard:
    build: ./frontend
    ports: ["127.0.0.1:5176:80"]
    depends_on: [api]
  worker:
    build: .
    profiles: ["worker"]
    command: ["python", "scripts/worker.py"]
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      DATABASE_URL: postgresql://mlops_platform:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/mlops_platform
      MLFLOW_TRACKING_URI: sqlite:////runtime/mlflow.db
    volumes: ["runtime:/runtime"]
    depends_on:
      prefect:
        condition: service_healthy
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./configs/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["127.0.0.1:9091:9090"]
  grafana:
    image: grafana/grafana:12.0.2
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-development-only}
    volumes: ["./configs/grafana/provisioning:/etc/grafana/provisioning:ro", "./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    depends_on: [prometheus]
  prefect:
    build: .
    profiles: ["worker"]
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health',timeout=5)"]
      interval: 5s
      retries: 30
    ports: ["127.0.0.1:4200:4200"]
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_HOME: /prefect
    volumes: ["prefect:/prefect"]
volumes:
  prefect:
  database:
  runtime:
