groups:
  - name: model-lifecycle
    rules:
      - alert: ModelPerformanceDegraded
        expr: mlops_platform_performance_degraded == 1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Recent labeled champion quality requires retraining review"}
      - alert: FeatureDriftDetected
        expr: mlops_platform_drifted_features >= 2
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Feature drift requires a retraining review"}
      - alert: PredictionErrors
        expr: sum(rate(mlops_platform_prediction_errors_total[5m])) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Prediction failures detected"}
      - alert: PredictionLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(mlops_platform_prediction_seconds_bucket[5m])) by (le)) > 0.25
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Prediction p95 exceeds 250 ms"}
